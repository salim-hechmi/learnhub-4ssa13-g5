services:
  mysql:
    image: mysql:8.0
    container_name: learnhub-community-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: learnhub_community_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro   # exécuté au 1er démarrage
    healthcheck:
      # -h 127.0.0.1 (TCP) : le serveur temporaire d'initialisation n'écoute pas en TCP
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:             # interface web de la BD -> http://localhost:8089
    image: phpmyadmin:5
    container_name: learnhub-community-pma
    ports: ["8089:80"]
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql: { condition: service_healthy }

  community-service:
    build: .
    container_name: learnhub-community-service
    ports: ["8086:8086"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/learnhub_community_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  mysql_data:
