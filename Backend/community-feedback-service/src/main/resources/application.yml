server:
  port: 8086

spring:
  application:
    name: community-feedback-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learnhub_community_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update        # crée/complète les tables au démarrage (schéma de référence : mysql-init/init.sql)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
