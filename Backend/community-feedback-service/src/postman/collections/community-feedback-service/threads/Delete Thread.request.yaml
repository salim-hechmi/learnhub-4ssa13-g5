$kind: http-request
name: Delete Thread
method: DELETE
url: '{{base_url}}/api/threads/{{thread_id}}'
order: 5000
pathVariables:
  - key: thread_id
    value: '{{thread_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", function () {
          pm.response.to.have.status(204);
      });
