$kind: http-request
name: Delete Badge
method: DELETE
url: '{{base_url}}/api/badges/{{badge_id}}'
order: 5000
pathVariables:
  - key: badge_id
    value: '{{badge_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", function () {
          pm.response.to.have.status(204);
      });
