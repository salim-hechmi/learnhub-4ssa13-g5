$kind: http-request
name: Update Badge
method: PUT
url: '{{base_url}}/api/badges/{{badge_id}}'
order: 4000
pathVariables:
  - key: badge_id
    value: '{{badge_id}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "AWD_ARCHITECT",
      "name": "API Architect (updated)",
      "description": "Awarded for completing the API design and architecture track",
      "icon": "architect-icon-v2",
      "triggerEvent": "CertificateIssued"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
