$kind: http-request
name: Delete User Badge
method: DELETE
url: '{{base_url}}/api/user-badges/{{user_badge_id}}'
order: 5000
pathVariables:
  - key: user_badge_id
    value: '{{user_badge_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", function () {
          pm.response.to.have.status(204);
      });
