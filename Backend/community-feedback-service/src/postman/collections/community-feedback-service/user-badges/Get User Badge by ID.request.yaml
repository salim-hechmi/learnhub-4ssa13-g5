$kind: http-request
name: Get User Badge by ID
method: GET
url: '{{base_url}}/api/user-badges/{{user_badge_id}}'
order: 2000
pathVariables:
  - key: user_badge_id
    value: '{{user_badge_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has an id", function () {
          pm.expect(pm.response.json()).to.have.property('id');
      });
