$kind: http-request
name: Moderate Review
method: PATCH
url: '{{base_url}}/api/reviews/{{review_id}}/moderate?status=APPROVED'
order: 8000
pathVariables:
  - key: review_id
    value: '{{review_id}}'
queryParams:
  - key: status
    value: APPROVED
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Moderation status is APPROVED", function () {
          pm.expect(pm.response.json().moderationStatus).to.eql('APPROVED');
      });
