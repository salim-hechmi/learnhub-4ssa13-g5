$kind: http-request
name: Delete Review
method: DELETE
url: '{{base_url}}/api/reviews/{{review_id}}'
order: 5000
pathVariables:
  - key: review_id
    value: '{{review_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", function () {
          pm.response.to.have.status(204);
      });
