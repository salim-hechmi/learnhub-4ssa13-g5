$kind: http-request
name: Search Reviews
method: GET
url: '{{base_url}}/api/reviews/search?q=&status=PENDING'
order: 6000
queryParams:
  - key: q
    value: ''
  - key: status
    value: PENDING
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is an array", function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
