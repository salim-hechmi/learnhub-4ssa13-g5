$kind: http-request
name: Reviews by Course
method: GET
url: '{{base_url}}/api/reviews/course/{{course_id}}'
order: 7000
pathVariables:
  - key: course_id
    value: '{{course_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is an array", function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
