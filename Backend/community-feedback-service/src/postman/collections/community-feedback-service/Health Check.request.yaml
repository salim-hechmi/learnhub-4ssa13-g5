$kind: http-request
name: Health Check
method: GET
url: '{{base_url}}/'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Service is UP", function () {
          pm.expect(pm.response.json().status).to.eql('UP');
      });
