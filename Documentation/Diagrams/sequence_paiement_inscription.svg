<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="0" y="0" width="950" height="50" fill="#1e293b"/>
  <text x="475" y="32" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">COMMUNICATION ASYNCHRONE : PAIEMENT ET INSCRIPTION AUTOMATIQUE</text>

  <!-- Lignes de vie -->
  <!-- Client -->
  <rect x="50" y="70" width="120" height="40" rx="6" fill="#3b82f6"/>
  <text x="110" y="95" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Client (Frontend)</text>
  <line x1="110" y1="110" x2="110" y2="500" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Marketplace Service (Selim Hechmi) -->
  <rect x="250" y="70" width="180" height="40" rx="6" fill="#2563eb"/>
  <text x="340" y="95" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Marketplace &amp; Billing (:8085)</text>
  <line x1="340" y1="110" x2="340" y2="500" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- RabbitMQ -->
  <rect x="530" y="70" width="150" height="40" rx="6" fill="#e11d48"/>
  <text x="605" y="95" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">RabbitMQ Broker</text>
  <line x1="605" y1="110" x2="605" y2="500" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Learning Journey Service -->
  <rect x="750" y="70" width="160" height="40" rx="6" fill="#10b981"/>
  <text x="830" y="95" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Learning Journey (:8083)</text>
  <line x1="830" y1="110" x2="830" y2="500" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Messages -->
  <!-- 1. POST /payments -->
  <line x1="110" y1="140" x2="335" y2="140" stroke="#1e293b" stroke-width="2"/>
  <polygon points="335,135 345,140 335,145" fill="#1e293b"/>
  <text x="220" y="132" fill="#1e293b" font-size="11" text-anchor="middle">1. POST /api/orders/{id}/payments (Simulation)</text>

  <!-- Exécution Marketplace -->
  <rect x="335" y="145" width="10" height="120" fill="#93c5fd"/>
  <text x="355" y="165" fill="#1e40af" font-size="10.5">Valide le montant, enregistre la transaction</text>
  <text x="355" y="180" fill="#1e40af" font-size="10.5">et crée l'entité Invoice (Facture)</text>

  <!-- 2. Publication Event RabbitMQ -->
  <line x1="345" y1="205" x2="600" y2="205" stroke="#e11d48" stroke-width="2.5"/>
  <polygon points="600,200 610,205 600,210" fill="#e11d48"/>
  <text x="470" y="198" fill="#e11d48" font-size="11" font-weight="bold" text-anchor="middle">2. Publie: PaymentCompleted (orderId, studentId, courseId)</text>

  <!-- 3. Réponse 201 Created immédiate sans bloquer -->
  <line x1="335" y1="245" x2="115" y2="245" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="115,240 105,245 115,250" fill="#2563eb"/>
  <text x="220" y="238" fill="#2563eb" font-size="11" font-weight="bold" text-anchor="middle">3. 201 Created (Paiement validé, non bloquant)</text>

  <!-- 4. Consommation RabbitMQ par Journey -->
  <rect x="600" y="210" width="10" height="130" fill="#fca5a5"/>
  <line x1="610" y1="290" x2="825" y2="290" stroke="#e11d48" stroke-width="2.5"/>
  <polygon points="825,285 835,290 825,295" fill="#e11d48"/>
  <text x="720" y="282" fill="#e11d48" font-size="11" font-weight="bold" text-anchor="middle">4. Consomme PaymentCompleted</text>

  <!-- 5. Traitement idempotent Learning Journey -->
  <rect x="825" y="295" width="10" height="120" fill="#6ee7b7"/>
  <text x="845" y="320" fill="#065f46" font-size="10.5">Vérifie l'idempotence (évite doublon)</text>
  <text x="845" y="335" fill="#065f46" font-size="10.5">Crée Enrollment &amp; LearningProgress</text>
  <text x="845" y="350" fill="#065f46" font-size="10.5">Progression initiale = 0%</text>

  <!-- Explication Justification AWD -->
  <rect x="50" y="440" width="860" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="462" fill="#0f172a" font-size="11" font-weight="bold">✓ Justification AWD :</text>
  <text x="210" y="462" fill="#334155" font-size="11">Le découplage asynchrone permet au paiement de réussir instantanément sans subir les latences ou indisponibilités de Journey.</text>
  <text x="70" y="480" fill="#475569" font-size="10.5">Si le service Journey est temporairement indisponible, le message reste sécurisé dans RabbitMQ et sera rejoué dès son redémarrage.</text>
</svg>