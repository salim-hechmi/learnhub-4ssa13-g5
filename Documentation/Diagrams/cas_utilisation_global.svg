<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="0" y="0" width="1000" height="60" fill="#1e293b"/>
  <text x="500" y="38" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">DIAGRAMME DE CAS D'UTILISATION GLOBAL - LEARNHUB</text>

  <!-- Frontière Système -->
  <rect x="220" y="80" width="560" height="590" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="500" y="110" fill="#334155" font-size="16" font-weight="bold" text-anchor="middle">Système LearnHub (Plateforme d'apprentissage)</text>

  <!-- Acteur Étudiant (Gauche) -->
  <g transform="translate(50, 200)">
    <circle cx="40" cy="30" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="40" y1="50" x2="40" y2="100" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="10" y1="70" x2="70" y2="70" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="15" y2="140" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="65" y2="140" stroke="#2563eb" stroke-width="2.5"/>
    <text x="40" y="165" fill="#1e293b" font-size="13" font-weight="bold" text-anchor="middle">Étudiant</text>
  </g>

  <!-- Acteur Formateur (Droite Haut) -->
  <g transform="translate(870, 160)">
    <circle cx="40" cy="30" r="20" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
    <line x1="40" y1="50" x2="40" y2="100" stroke="#10b981" stroke-width="2.5"/>
    <line x1="10" y1="70" x2="70" y2="70" stroke="#10b981" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="15" y2="140" stroke="#10b981" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="65" y2="140" stroke="#10b981" stroke-width="2.5"/>
    <text x="40" y="165" fill="#1e293b" font-size="13" font-weight="bold" text-anchor="middle">Formateur</text>
  </g>

  <!-- Acteur Administrateur (Droite Bas) -->
  <g transform="translate(870, 430)">
    <circle cx="40" cy="30" r="20" fill="#ffffff" stroke="#e11d48" stroke-width="2.5"/>
    <line x1="40" y1="50" x2="40" y2="100" stroke="#e11d48" stroke-width="2.5"/>
    <line x1="10" y1="70" x2="70" y2="70" stroke="#e11d48" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="15" y2="140" stroke="#e11d48" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="65" y2="140" stroke="#e11d48" stroke-width="2.5"/>
    <text x="40" y="165" fill="#1e293b" font-size="13" font-weight="bold" text-anchor="middle">Administrateur</text>
  </g>

  <!-- Cas d'utilisation (Ellipses) -->
  <!-- UC 1 : Explorer le catalogue -->
  <ellipse cx="400" cy="160" rx="120" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="165" fill="#1e293b" font-size="12" text-anchor="middle">Explorer le catalogue de cours</text>

  <!-- UC 2 : Acheter formation -->
  <ellipse cx="400" cy="225" rx="130" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="230" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Commander &amp; Payer formation (Marketplace)</text>

  <!-- UC 3 : Suivre progression -->
  <ellipse cx="400" cy="290" rx="120" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="295" fill="#1e293b" font-size="12" text-anchor="middle">Apprendre &amp; Valider leçons</text>

  <!-- UC 4 : Passer quiz & obtenir certificat -->
  <ellipse cx="400" cy="355" rx="130" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="360" fill="#1e293b" font-size="12" text-anchor="middle">Passer quiz &amp; Obtenir certificat</text>

  <!-- UC 5 : Publier avis & échanger -->
  <ellipse cx="400" cy="420" rx="130" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="425" fill="#1e293b" font-size="12" text-anchor="middle">Publier un avis vérifié &amp; Participer</text>

  <!-- UC 6 : Coach IA -->
  <ellipse cx="400" cy="485" rx="130" ry="25" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="400" y="490" fill="#581c87" font-size="12" font-weight="bold" text-anchor="middle">Plan d'étude &amp; Tuteur IA (Coach)</text>

  <!-- UC Formateur : Créer et publier cours -->
  <ellipse cx="620" cy="210" rx="110" ry="25" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="620" y="215" fill="#1e293b" font-size="12" text-anchor="middle">Créer &amp; Publier un cours</text>

  <!-- UC Formateur : Gérer évaluations -->
  <ellipse cx="620" cy="280" rx="110" ry="25" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="620" y="285" fill="#1e293b" font-size="12" text-anchor="middle">Créer quiz &amp; Questions</text>

  <!-- UC Admin : Gérer utilisateurs & modération -->
  <ellipse cx="620" cy="540" rx="120" ry="25" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="620" y="545" fill="#1e293b" font-size="12" text-anchor="middle">Gérer comptes, rôles &amp; modérer</text>

  <!-- Lignes d'association -->
  <line x1="120" y1="230" x2="280" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="250" x2="270" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="270" x2="280" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="280" x2="270" y2="355" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="300" x2="270" y2="420" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="320" x2="270" y2="485" stroke="#94a3b8" stroke-width="1.5"/>

  <line x1="870" y1="230" x2="730" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="870" y1="250" x2="730" y2="280" stroke="#94a3b8" stroke-width="1.5"/>

  <line x1="870" y1="480" x2="740" y2="540" stroke="#94a3b8" stroke-width="1.5"/>
</svg>