<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
    <rect x="0" y="0" width="900" height="50" fill="#1e293b"/>
    <text x="450" y="32" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">DIAGRAMME DE CLASSES : MARKETPLACE & BILLING (:8085) - SELIM HECHMI</text>
    
      <!-- Order -->
      <g transform="translate(50, 80)">
        <rect width="240" height="160" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
        <rect width="240" height="30" rx="6" fill="#2563eb"/>
        <text x="120" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Order</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- studentId: Long (ref ID)</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- totalAmount: Double</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- currency: String</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- status: String (PAID/PENDING)</text>
        <text x="15" y="155" fill="#0f172a" font-size="11">- createdAt: LocalDateTime</text>
      </g>
      <!-- OrderItem -->
      <g transform="translate(380, 80)">
        <rect width="220" height="130" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
        <rect width="220" height="30" rx="6" fill="#2563eb"/>
        <text x="110" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">OrderItem</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- orderId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- courseId: Long (ref ID)</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- price: Double</text>
      </g>
      <!-- Payment -->
      <g transform="translate(50, 280)">
        <rect width="240" height="150" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
        <rect width="240" height="30" rx="6" fill="#2563eb"/>
        <text x="120" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Payment</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- orderId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- amount: Double</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- paymentMethod: String</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- transactionId: String</text>
      </g>
      <!-- Invoice -->
      <g transform="translate(380, 280)">
        <rect width="220" height="150" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
        <rect width="220" height="30" rx="6" fill="#2563eb"/>
        <text x="110" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Invoice</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- orderId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- invoiceNumber: String</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- downloadUrl: String</text>
      </g>
      <!-- Relations -->
      <line x1="290" y1="140" x2="380" y2="140" stroke="#2563eb" stroke-width="2"/>
      <text x="300" y="132" fill="#2563eb" font-size="11" font-weight="bold">1</text>
      <text x="360" y="132" fill="#2563eb" font-size="11" font-weight="bold">1..*</text>

      <line x1="170" y1="240" x2="170" y2="280" stroke="#2563eb" stroke-width="2"/>
      <text x="155" y="255" fill="#2563eb" font-size="11" font-weight="bold">1</text>
      <text x="155" y="275" fill="#2563eb" font-size="11" font-weight="bold">0..*</text>

      <line x1="290" y1="210" x2="380" y2="330" stroke="#2563eb" stroke-width="2"/>
      <text x="300" y="225" fill="#2563eb" font-size="11" font-weight="bold">1</text>
      <text x="360" y="325" fill="#2563eb" font-size="11" font-weight="bold">0..1</text>
    
  </svg>