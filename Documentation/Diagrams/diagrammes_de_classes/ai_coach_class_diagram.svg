<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
    <rect x="0" y="0" width="900" height="50" fill="#1e293b"/>
    <text x="450" y="32" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">DIAGRAMME DE CLASSES : AI LEARNING COACH (:8087) - SERVICE AVANCÉ</text>
    
      <!-- StudyPlan -->
      <g transform="translate(60, 80)">
        <rect width="240" height="150" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
        <rect width="240" height="30" rx="6" fill="#9333ea"/>
        <text x="120" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">StudyPlan</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- studentId: Long (ref ID)</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- targetObjective: String</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- weeklyAvailabilityHours: Int</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- generatedAt: LocalDateTime</text>
      </g>
      <!-- AIRecommendation -->
      <g transform="translate(370, 80)">
        <rect width="240" height="150" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
        <rect width="240" height="30" rx="6" fill="#9333ea"/>
        <text x="120" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">AIRecommendation</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- studyPlanId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- recommendedCourseId: Long</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- justificationReason: String</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- priorityLevel: String</text>
      </g>
      <!-- ChatSession -->
      <g transform="translate(60, 270)">
        <rect width="240" height="130" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
        <rect width="240" height="30" rx="6" fill="#9333ea"/>
        <text x="120" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ChatSession</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- studentId: Long (ref ID)</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- topic: String</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- startedAt: LocalDateTime</text>
      </g>
      <!-- ChatMessage -->
      <g transform="translate(370, 270)">
        <rect width="240" height="130" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
        <rect width="240" height="30" rx="6" fill="#9333ea"/>
        <text x="120" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ChatMessage</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- sessionId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- senderRole: String</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- messageText: String</text>
      </g>
      <!-- Lines -->
      <line x1="300" y1="150" x2="370" y2="150" stroke="#9333ea" stroke-width="2"/>
      <text x="310" y="142" fill="#9333ea" font-size="11" font-weight="bold">1</text>
      <text x="350" y="142" fill="#9333ea" font-size="11" font-weight="bold">1..*</text>

      <line x1="300" y1="330" x2="370" y2="330" stroke="#9333ea" stroke-width="2"/>
      <text x="310" y="322" fill="#9333ea" font-size="11" font-weight="bold">1</text>
      <text x="350" y="322" fill="#9333ea" font-size="11" font-weight="bold">1..*</text>
    
  </svg>