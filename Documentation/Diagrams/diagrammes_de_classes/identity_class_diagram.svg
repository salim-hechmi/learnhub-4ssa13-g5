<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
    <rect x="0" y="0" width="900" height="50" fill="#1e293b"/>
    <text x="450" y="32" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">DIAGRAMME DE CLASSES : IDENTITY & USER MANAGEMENT (:8081)</text>
    
      <!-- User -->
      <g transform="translate(60, 80)">
        <rect width="250" height="160" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
        <rect width="250" height="30" rx="6" fill="#0284c7"/>
        <text x="125" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">User</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- email: String [UK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- password: String</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- firstName: String</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- lastName: String</text>
        <text x="15" y="155" fill="#0f172a" font-size="11">- enabled: Boolean</text>
      </g>
      <!-- UserProfile -->
      <g transform="translate(420, 80)">
        <rect width="250" height="160" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
        <rect width="250" height="30" rx="6" fill="#0284c7"/>
        <text x="125" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">UserProfile</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- userId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- bio: String</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- avatarUrl: String</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- headline: String</text>
        <text x="15" y="155" fill="#0f172a" font-size="11">- linkedInUrl: String</text>
      </g>
      <!-- Relation User 1 --- 1 UserProfile -->
      <line x1="310" y1="160" x2="420" y2="160" stroke="#0284c7" stroke-width="2"/>
      <text x="325" y="152" fill="#0284c7" font-size="11" font-weight="bold">1</text>
      <text x="400" y="152" fill="#0284c7" font-size="11" font-weight="bold">1</text>
    
  </svg>