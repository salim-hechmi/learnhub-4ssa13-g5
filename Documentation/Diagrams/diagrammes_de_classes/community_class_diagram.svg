<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
    <rect x="0" y="0" width="900" height="50" fill="#1e293b"/>
    <text x="450" y="32" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">DIAGRAMME DE CLASSES : COMMUNITY & FEEDBACK (:8086)</text>
    
      <!-- CourseReview -->
      <g transform="translate(50, 80)">
        <rect width="220" height="140" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
        <rect width="220" height="30" rx="6" fill="#0d9488"/>
        <text x="110" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CourseReview</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- courseId: Long (ref ID)</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- studentId: Long (ref ID)</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- rating: Integer (1 à 5)</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- comment: String</text>
      </g>
      <!-- DiscussionThread -->
      <g transform="translate(340, 80)">
        <rect width="220" height="150" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
        <rect width="220" height="30" rx="6" fill="#0d9488"/>
        <text x="110" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">DiscussionThread</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- courseId: Long (ref ID)</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- authorId: Long (ref ID)</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- title: String</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- isClosed: Boolean</text>
      </g>
      <!-- Post -->
      <g transform="translate(630, 80)">
        <rect width="200" height="140" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
        <rect width="200" height="30" rx="6" fill="#0d9488"/>
        <text x="100" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Post</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- threadId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- authorId: Long (ref ID)</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- content: String</text>
      </g>
      <!-- Badge -->
      <g transform="translate(50, 260)">
        <rect width="220" height="130" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
        <rect width="220" height="30" rx="6" fill="#0d9488"/>
        <text x="110" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Badge</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- studentId: Long (ref ID)</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- badgeType: String</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- title: String</text>
      </g>
      <!-- Line Thread --- Post -->
      <line x1="560" y1="140" x2="630" y2="140" stroke="#0d9488" stroke-width="2"/>
      <text x="568" y="132" fill="#0d9488" font-size="11" font-weight="bold">1</text>
      <text x="615" y="132" fill="#0d9488" font-size="11" font-weight="bold">1..*</text>
    
  </svg>