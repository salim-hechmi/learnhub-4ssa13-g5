<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
    <rect x="0" y="0" width="900" height="50" fill="#1e293b"/>
    <text x="450" y="32" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">DIAGRAMME DE CLASSES : LEARNING JOURNEY (:8083)</text>
    
      <!-- Enrollment -->
      <g transform="translate(60, 80)">
        <rect width="230" height="150" rx="6" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
        <rect width="230" height="30" rx="6" fill="#10b981"/>
        <text x="115" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Enrollment</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- studentId: Long (ref ID)</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- courseId: Long (ref ID)</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- status: String</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- enrolledAt: LocalDateTime</text>
      </g>
      <!-- LearningProgress -->
      <g transform="translate(370, 80)">
        <rect width="240" height="150" rx="6" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
        <rect width="240" height="30" rx="6" fill="#10b981"/>
        <text x="120" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LearningProgress</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- enrollmentId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- completionPercentage: Double</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- completedLessonsCount: Int</text>
        <text x="15" y="135" fill="#0f172a" font-size="11">- lastAccessedAt: LocalDateTime</text>
      </g>
      <!-- LessonCompletion -->
      <g transform="translate(370, 270)">
        <rect width="240" height="130" rx="6" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
        <rect width="240" height="30" rx="6" fill="#10b981"/>
        <text x="120" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LessonCompletion</text>
        <text x="15" y="55" fill="#0f172a" font-size="11">- id: Long [PK]</text>
        <text x="15" y="75" fill="#0f172a" font-size="11">- progressId: Long [FK]</text>
        <text x="15" y="95" fill="#0f172a" font-size="11">- resourceId: Long (ref ID)</text>
        <text x="15" y="115" fill="#0f172a" font-size="11">- completed: Boolean</text>
      </g>
      <!-- Lines -->
      <line x1="290" y1="150" x2="370" y2="150" stroke="#10b981" stroke-width="2"/>
      <text x="300" y="142" fill="#10b981" font-size="11" font-weight="bold">1</text>
      <text x="350" y="142" fill="#10b981" font-size="11" font-weight="bold">1</text>

      <line x1="490" y1="230" x2="490" y2="270" stroke="#10b981" stroke-width="2"/>
      <text x="475" y="245" fill="#10b981" font-size="11" font-weight="bold">1</text>
      <text x="475" y="265" fill="#10b981" font-size="11" font-weight="bold">1..*</text>
    
  </svg>