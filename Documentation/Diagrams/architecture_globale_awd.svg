<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Titre -->
  <rect x="0" y="0" width="1200" height="70" fill="#1e293b"/>
  <text x="600" y="42" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">ARCHITECTURE GLOBALE DISTRIBUÉE - LEARNHUB (MODULE AWD 2026/2027)</text>

  <!-- Cadre Docker -->
  <rect x="30" y="90" width="1140" height="780" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="125" fill="#475569" font-size="16" font-weight="bold"><tspan fill="#0284c7">🐳 DOCKER CONTAINERIZATION</tspan> (Microservices &amp; Infrastructure)</text>

  <!-- COUCHE CLIENT (FRONTEND) -->
  <rect x="70" y="150" width="220" height="90" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="70" y="150" width="220" height="28" rx="10" fill="#3b82f6"/>
  <text x="180" y="170" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CLIENT FRONTEND</text>
  <text x="180" y="195" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Application Web LearnHub</text>
  <text x="180" y="215" fill="#64748b" font-size="11" text-anchor="middle">Port 3000 (React / JS / HTML5)</text>

  <!-- Ligne Client -> Gateway -->
  <line x1="290" y1="195" x2="380" y2="195" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="335" y="185" fill="#2563eb" font-size="11" font-weight="bold" text-anchor="middle">HTTP/REST</text>

  <!-- API GATEWAY -->
  <rect x="380" y="145" width="240" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="380" y="145" width="240" height="28" rx="10" fill="#2563eb"/>
  <text x="500" y="165" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SPRING CLOUD API GATEWAY</text>
  <text x="500" y="192" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Point d'entrée unique (:8080)</text>
  <text x="500" y="212" fill="#64748b" font-size="11" text-anchor="middle">Routage dynamique, Filtres JWT &amp; CORS</text>

  <!-- INFRASTRUCTURE HORIZONTALE : EUREKA, CONFIG SERVER, KEYCLOAK -->
  <!-- Eureka -->
  <rect x="660" y="145" width="210" height="90" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="145" width="210" height="26" rx="10" fill="#8b5cf6"/>
  <text x="765" y="163" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EUREKA SERVER</text>
  <text x="765" y="190" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Service Discovery (:8761)</text>
  <text x="765" y="210" fill="#64748b" font-size="11" text-anchor="middle">Enregistrement dynamique</text>

  <!-- Keycloak -->
  <rect x="910" y="145" width="220" height="90" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
  <rect x="910" y="145" width="220" height="26" rx="10" fill="#e11d48"/>
  <text x="1020" y="163" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">KEYCLOAK / JWT</text>
  <text x="1020" y="190" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Identity Provider (:8080)</text>
  <text x="1020" y="210" fill="#64748b" font-size="11" text-anchor="middle">RBAC, Jetons sécurisés</text>

  <!-- Ligne Gateway <-> Eureka -->
  <line x1="620" y1="190" x2="660" y2="190" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- ZONE DES 7 MICROSERVICES -->
  <rect x="60" y="290" width="1080" height="340" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="318" fill="#334155" font-size="15" font-weight="bold">COUCHE MÉTIER : 7 MICROSERVICES SPRING BOOT (1 Base par Service - Bounded Contexts)</text>

  <!-- Microservice 0 (Commun) : Identity -->
  <g transform="translate(80, 340)">
    <rect width="220" height="110" rx="8" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
    <rect width="220" height="26" rx="8" fill="#0284c7"/>
    <text x="110" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">identity-service (:8081)</text>
    <text x="110" y="45" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">Service Commun (Tous)</text>
    <text x="110" y="65" fill="#475569" font-size="9.5" text-anchor="middle">User, Role, UserProfile</text>
    <text x="110" y="85" fill="#0284c7" font-size="9" font-weight="bold" text-anchor="middle">Auth JWT, Rôles &amp; Droits</text>
  </g>

  <!-- Microservice 1 : Course Management -->
  <g transform="translate(340, 340)">
    <rect width="230" height="110" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
    <rect width="230" height="26" rx="8" fill="#3b82f6"/>
    <text x="115" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">course-service (:8082)</text>
    <text x="115" y="45" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">Course Management</text>
    <text x="115" y="65" fill="#475569" font-size="9.5" text-anchor="middle">Course, Category, Chapter, Res.</text>
    <text x="115" y="85" fill="#3b82f6" font-size="9" text-anchor="middle">Catalogue, Publication de cours</text>
  </g>

  <!-- Microservice 2 : Learning Journey -->
  <g transform="translate(610, 340)">
    <rect width="230" height="110" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
    <rect width="230" height="26" rx="8" fill="#10b981"/>
    <text x="115" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">learning-journey-service (:8083)</text>
    <text x="115" y="45" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">Learning Journey</text>
    <text x="115" y="65" fill="#475569" font-size="9.5" text-anchor="middle">Enrollment, Progress, LessonDone</text>
    <text x="115" y="85" fill="#10b981" font-size="9" text-anchor="middle">Suivi progression &amp; Inscriptions</text>
  </g>

  <!-- Microservice 3 : Assessment & Certification -->
  <g transform="translate(880, 340)">
    <rect width="230" height="110" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
    <rect width="230" height="26" rx="8" fill="#f59e0b"/>
    <text x="115" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">assessment-service (:8084)</text>
    <text x="115" y="45" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">Assessment &amp; Certification</text>
    <text x="115" y="65" fill="#475569" font-size="9.5" text-anchor="middle">Quiz, Question, Attempt, Certif.</text>
    <text x="115" y="85" fill="#f59e0b" font-size="9" text-anchor="middle">Évaluations, Scores, Diplômes</text>
  </g>

  <!-- Ligne inférieure des microservices -->
  <!-- Microservice 4 : Marketplace & Billing (SELIM HECHMI) -->
  <g transform="translate(180, 480)">
    <rect width="250" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect width="250" height="28" rx="8" fill="#2563eb"/>
    <text x="125" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">marketplace-service (:8085)</text>
    <text x="125" y="48" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">★ RESPONSABLE : SELIM HECHMI</text>
    <text x="125" y="68" fill="#1e293b" font-size="10" font-weight="bold" text-anchor="middle">Order, OrderItem, Payment, Invoice</text>
    <text x="125" y="88" fill="#475569" font-size="9.5" text-anchor="middle">Paniers, Paiement Sandbox, Factures</text>
    <text x="125" y="106" fill="#2563eb" font-size="9" font-weight="bold" text-anchor="middle">Émetteur : PaymentCompleted</text>
  </g>

  <!-- Microservice 5 : Community & Feedback -->
  <g transform="translate(480, 480)">
    <rect width="240" height="120" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
    <rect width="240" height="28" rx="8" fill="#0d9488"/>
    <text x="120" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">community-service (:8086)</text>
    <text x="120" y="48" fill="#0f172a" font-size="10.5" font-weight="bold" text-anchor="middle">Community &amp; Feedback</text>
    <text x="120" y="68" fill="#1e293b" font-size="10" text-anchor="middle">Review, Thread, Post, Badge</text>
    <text x="120" y="88" fill="#475569" font-size="9.5" text-anchor="middle">Avis vérifiés, Modération, Badges</text>
    <text x="120" y="106" fill="#0d9488" font-size="9" font-weight="bold" text-anchor="middle">Émetteur : ReviewPosted</text>
  </g>

  <!-- Microservice 6 : AI Learning Coach (Service Avancé) -->
  <g transform="translate(770, 480)">
    <rect width="260" height="120" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
    <rect width="260" height="28" rx="8" fill="#9333ea"/>
    <text x="130" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">ai-learning-coach-service (:8087)</text>
    <text x="130" y="48" fill="#7e22ce" font-size="10.5" font-weight="bold" text-anchor="middle">🤖 SERVICE AVANCÉ (IA)</text>
    <text x="130" y="68" fill="#1e293b" font-size="10" text-anchor="middle">StudyPlan, Recommendation, Chat</text>
    <text x="130" y="88" fill="#475569" font-size="9.5" text-anchor="middle">Recommandations &amp; Tuteur IA</text>
    <text x="130" y="106" fill="#7e22ce" font-size="9" font-weight="bold" text-anchor="middle">Appels synchrones Feign &amp; NLP</text>
  </g>

  <!-- BUS DE MESSAGES ASYNCHRONE : RABBITMQ -->
  <rect x="60" y="650" width="1080" height="80" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="650" width="1080" height="24" rx="10" fill="#e11d48"/>
  <text x="600" y="667" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">BROKER DE MESSAGES ASYNCHRONES : RABBITMQ (:5672 / :15672) - Échanges Topic / Fanout</text>
  <text x="250" y="700" fill="#9f1239" font-size="11" font-weight="bold">⚡ Événement : PaymentCompleted</text>
  <text x="250" y="718" fill="#475569" font-size="10">Marketplace ➔ RabbitMQ ➔ Learning Journey (Inscription auto)</text>
  <text x="630" y="700" fill="#9f1239" font-size="11" font-weight="bold">⚡ Événement : ReviewPosted</text>
  <text x="630" y="718" fill="#475569" font-size="10">Community ➔ RabbitMQ ➔ Course Management (Note moy.)</text>
  <text x="960" y="700" fill="#9f1239" font-size="11" font-weight="bold">⚡ CertificateIssued</text>
  <text x="960" y="718" fill="#475569" font-size="10">Assessment ➔ Community (Badge)</text>

  <!-- LIAISONS BASES DE DONNÉES DÉDIÉES -->
  <rect x="60" y="750" width="1080" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="775" fill="#15803d" font-size="13" font-weight="bold">💾 COUCHE DONNÉES DÉDIÉES : AUCUNE BASE PARTAGÉE (Database-per-Service Pattern)</text>
  
  <g transform="translate(90, 790)">
    <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="20" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">MySQL</text>
    <text x="65" y="36" fill="#15803d" font-size="9" text-anchor="middle">learnhub_identity</text>
  </g>
  <g transform="translate(240, 790)">
    <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="20" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">MySQL</text>
    <text x="65" y="36" fill="#15803d" font-size="9" text-anchor="middle">learnhub_course</text>
  </g>
  <g transform="translate(390, 790)">
    <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="20" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">MySQL</text>
    <text x="65" y="36" fill="#15803d" font-size="9" text-anchor="middle">learnhub_journey</text>
  </g>
  <g transform="translate(540, 790)">
    <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="20" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">MySQL</text>
    <text x="65" y="36" fill="#15803d" font-size="9" text-anchor="middle">learnhub_assessment</text>
  </g>
  <g transform="translate(690, 790)">
    <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="20" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">MySQL</text>
    <text x="65" y="36" fill="#15803d" font-size="9" text-anchor="middle">learnhub_market</text>
  </g>
  <g transform="translate(840, 790)">
    <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="20" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">MongoDB</text>
    <text x="65" y="36" fill="#15803d" font-size="9" text-anchor="middle">learnhub_community</text>
  </g>
  <g transform="translate(990, 790)">
    <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="20" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">MongoDB</text>
    <text x="65" y="36" fill="#15803d" font-size="9" text-anchor="middle">learnhub_aicoach</text>
  </g>
</svg>